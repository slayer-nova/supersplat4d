<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- jszip -->
        <script src="jszip.js"></script>

        <!-- Mobile debug console (eruda) - Remove in production -->
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
        <script>
            // Initialize eruda for mobile debugging
            if (typeof eruda !== 'undefined') {
                eruda.init();
                console.log('📱 Eruda mobile console initialized');
            }
        </script>

        <!-- Service worker. SKIPPED on localhost: during development the SW kept serving a stale
             app bundle after rebuilds (the export ran OLD code with no visible error), so local
             serving always loads fresh from dist; any previously-registered SW is torn down. -->
        <script>
            const sw = navigator.serviceWorker;
            const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
            if (sw && !isLocalDev) {
                sw.register('./sw.js')
                    .then(reg => console.log('service worker registered', reg))
                    .catch(err => console.log('failed to register service worker', err));
            } else if (sw && isLocalDev) {
                sw.getRegistrations().then((regs) => {
                    if (regs.length) {
                        Promise.all(regs.map(r => r.unregister()))
                            .then(() => caches.keys())
                            .then(keys => Promise.all(keys.map(k => caches.delete(k))))
                            .then(() => console.log('local dev: stale service worker + caches cleared'));
                    }
                });
            }
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>
    </body>
</html>
